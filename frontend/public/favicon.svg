<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SoundDeck">
  <!--
    A aba do navegador segue a regra da paleta: em repouso a marca é
    rigorosamente acromática. Cor na tela significa som no ar, e um ícone
    verde mentiria sobre isso mesmo com o deck em silêncio.

    O desenho é a redução do wordmark da barra superior — as duas iniciais
    sobre a superfície do painel, sem inventar linguagem visual nova.
  -->
  <rect width="32" height="32" rx="7" fill="#1e1e1e" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#545454" />
  <text
    x="16"
    y="22"
    text-anchor="middle"
    fill="#f7f7f7"
    font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="15"
    font-weight="600"
    letter-spacing="-0.5"
  >SD</text>
</svg>
